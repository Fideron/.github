name: Engineering Task
description: Track technical, architectural, maintenance, infrastructure, or internal engineering work.
title: "[Engineering]: "
labels:

* enhancement
  body:

* type: markdown
  attributes:
  value: |
  Use this form for engineering work that is not best represented as a bug or user-facing feature.

* type: textarea
  id: objective
  attributes:
  label: Objective
  description: What engineering outcome should be achieved?
  validations:
  required: true

* type: textarea
  id: rationale
  attributes:
  label: Rationale
  description: Why is this work necessary?
  validations:
  required: true

* type: textarea
  id: scope
  attributes:
  label: Scope
  description: Describe what is included in this task.
  validations:
  required: true

* type: textarea
  id: out_of_scope
  attributes:
  label: Out of Scope
  description: Describe anything explicitly excluded from this task.
  validations:
  required: false

* type: textarea
  id: acceptance
  attributes:
  label: Acceptance Criteria
  description: Define the conditions that must be met for this task to be considered complete.
  placeholder: |
  - [ ] ...
  - [ ] ...
  - [ ] ...
  validations:
  required: true

* type: textarea
  id: dependencies
  attributes:
  label: Dependencies or Blockers
  description: Identify related issues, pull requests, services, teams, or technical dependencies.
  validations:
  required: false

* type: textarea
  id: notes
  attributes:
  label: Implementation Notes
  description: Include relevant architectural or technical guidance where useful.
  validations:
  required: false
