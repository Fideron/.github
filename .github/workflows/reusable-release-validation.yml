name: Reusable Release Validation

on:
workflow_call:
inputs:
version:
description: Semantic version being prepared for release.
required: true
type: string

jobs:
validate-release:
name: Validate release
runs-on: ubuntu-latest

```
steps:
  - name: Validate release branch flow
    shell: bash
    run: |
      if [[ "${{ github.base_ref }}" != "main" ]]; then
        echo "Release pull requests must target 'main'."
        exit 1
      fi

      if [[ "${{ github.head_ref }}" != "next" ]]; then
        echo "Release pull requests must originate from 'next'."
        exit 1
      fi

      echo "Release branch flow is valid: next -> main"

  - name: Validate semantic version
    shell: bash
    env:
      VERSION: ${{ inputs.version }}
    run: |
      if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
        echo "'$VERSION' is not a valid Semantic Version."
        exit 1
      fi

      echo "Semantic Version is valid: $VERSION"
```
